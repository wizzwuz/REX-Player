name: CI/CD Build

on:
  push:
    branches:
      - master
      - dev
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate short SHA
        id: set-short-sha
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: 17
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew assembleRelease -PtargetAbi=arm64-v8a

      - name: Sign APK with Release Keystore
        run: |
          set -e
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"
          apk_dir="app/build/outputs/apk/release"
          unsigned="$apk_dir/app-arm64-v8a-release-unsigned.apk"
          signed="$apk_dir/app-arm64-v8a-release.apk"
          if [ -f "$unsigned" ] && [ ! -f "$signed" ]; then
            echo "Signing $unsigned with app/release.keystore..."
            $APKSIGNER sign --ks app/release.keystore \
              --ks-key-alias "androiddebugkey" \
              --ks-pass pass:android \
              --key-pass pass:android \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "$signed" "$unsigned"
          fi
          if [ -f "$signed" ]; then
            echo "Verifying $signed..."
            $APKSIGNER verify --verbose "$signed"
          else
            echo "Error: Neither $signed nor $unsigned was found"
            exit 1
          fi

      - name: Upload app-arm64-v8a Signed Artifact
        uses: actions/upload-artifact@v4
        with:
          name: REX-Player-arm64-v8a-release-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk